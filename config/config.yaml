app:
  port: 8080
  log_level: "debug"
  timeout_sec: 30
  rate_limit:
    enabled: true
    requests: 100
    window_seconds: 60
  auth_guard:
    skip: false
    ttl: 86400 # 24 hours in seconds
  

telegram:
  bot_api_url: "USE-SECRET-FROM-.env"
  bot_token: "TELEGRAM_BOT_KEY-FROM-.env"
  webhook_secret: "USE-SECRET-FROM-.env"

payment:
  webhook_secret: "USE-SECRET-FROM-.env"

goplus:
  key: "USE-KEY-FROM-.env"
  secret: "USE-SECRET-FROM-.env"

etherscan:
  url: "https://api.etherscan.io"
  key: "USE-KEY-FROM-.env"

alchemy:
  api_key: "USE-KEY-FROM-.env"
  url: "https://eth-mainnet.g.alchemy.com/v2"

sqlite:
  path: "./data.db"

scoring:
  base_score: 100
  weights:
    approvals: 0.4
    scam_tokens: 0.2
    rug_pulls: 0.2
    dead_nft: 0.1
    asset_ratio: 0.1

ttl:
  report: 5m # set from .env
  payment: 5m # set from .env

tasks:
  set_expires_tasks: true